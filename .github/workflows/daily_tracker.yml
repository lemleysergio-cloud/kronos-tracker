name: Kronos Hourly Tracker

on:
  schedule:
    # Runs at the top of every hour
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tracker mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - scrape
          - score
          - report

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tracker
        id: tracker
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          python tracker/kronos_tracker.py --${MODE} 2>&1 | tee tracker_output.txt

      - name: Upload tracker output as artifact
        uses: actions/upload-artifact@v4
        with:
          name: tracker-output-${{ github.run_id }}
          path: tracker_output.txt
          retention-days: 30

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json || true
          git add pending.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: kronos tracker update ${DATE} [skip ci]"
            git push
          fi

      - name: Send email report (17:00 UTC = noon EDT, 23:00 UTC = 7pm EDT)
        env:
          GMAIL_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: lemleysergio@gmail.com
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" = "17" ] || [ "$HOUR" = "23" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Sending email report (hour: $HOUR UTC)..."
            python tracker/send_email.py
          else
            echo "Not a send hour (current: ${HOUR} UTC) — skipping email."
          fi

      - name: Print summary to Actions log
        run: |
          echo "### Kronos Tracker Run Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tracker_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
