name: Kronos Hourly Tracker

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Tracker mode"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - scrape
          - score
          - report

# Prevents two runs (e.g. an hourly schedule firing while a manual run
# is still in progress) from racing to push at the same time, which was
# causing "non-fast-forward" push rejections. New runs wait in queue for
# the previous one to finish instead of colliding with it.
concurrency:
  group: kronos-tracker-run
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Kronos model weights
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            kronos_model
          key: kronos-mini-weights-v1
          restore-keys: |
            kronos-mini-weights-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run Kronos tracker + native inference
        run: |
          MODE="${{ github.event.inputs.mode || 'all' }}"
          python tracker/kronos_tracker.py --${MODE} 2>&1 | tee tracker_output.txt

      - name: Run barbell tracker
        run: |
          python tracker/barbell_tracker.py 2>&1 | tee -a tracker_output.txt

      - name: Run EV scanner (optional, standalone)
        continue-on-error: true
        run: |
          if [ -f tracker/ev_scanner.py ]; then
            python tracker/ev_scanner.py 2>&1 | tee -a tracker_output.txt
          else
            echo "ev_scanner.py not present — skipping (this is fine, it's optional)."
          fi

      - name: Upload tracker output
        uses: actions/upload-artifact@v4
        with:
          name: tracker-output-${{ github.run_id }}
          path: tracker_output.txt
          retention-days: 30

      - name: Commit updated data files
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scores.json        || true
          git add pending.json       || true
          git add barbell_trades.json || true
          git add ev_trades.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
            git commit -m "chore: kronos native inference update ${DATE} [skip ci]"
            # Rebase onto whatever landed on main since this run started
            # (e.g. a manual edit made in the GitHub web UI), then push.
            # Retries once more after a short wait in the rare case two
            # pushes still land within the same second.
            for attempt in 1 2; do
              git pull --rebase origin main && git push && break
              echo "Push attempt ${attempt} failed — retrying..."
              sleep 5
            done
          fi

      - name: Send email report
        env:
          GMAIL_USERNAME:    ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL:   lemleysergio@gmail.com
        run: |
          HOUR=$(date -u +"%H")
          if [ "$HOUR" = "17" ] || [ "$HOUR" = "23" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Sending email..."
            python tracker/send_email.py
          else
            echo "Not a send hour (${HOUR} UTC) — skipping."
          fi

      - name: Print summary
        run: |
          echo "### Kronos Native Inference Run" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat tracker_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
